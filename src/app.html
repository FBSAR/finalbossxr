<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="https://finalbossxr.s3.us-east-1.amazonaws.com/logos/FBS_Logo_Initial_Final_NoBG.png" />
		<title>Final Boss Studios - Change The Game</title>
		<meta name="description" content="Final Boss Studios — An indie XR game studio building Cosmic Collisions, an augmented reality space shooter." />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		%sveltekit.head%
		
		<!-- Preconnect to asset origins -->
		<link rel="preconnect" href="https://finalbossxr.s3.us-east-1.amazonaws.com" crossorigin>
		<link rel="dns-prefetch" href="https://finalbossxr.s3.us-east-1.amazonaws.com">
		
		<!-- Google Fonts (non-blocking) -->
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link rel="preload" href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
		<link rel="preload" href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
		<noscript>
			<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700&display=swap" rel="stylesheet">
			<link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
		</noscript>
		
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
